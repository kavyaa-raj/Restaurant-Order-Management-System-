<!DOCTYPE html>
<html>
<head>
    <title>Place Order</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🛒 Place Order</h1>

    <form action="/place_order" method="POST">

        <input type="text"
               name="customer_name"
               placeholder="Customer Name"
               required>

        <select name="food_name" required>

            <option value="">
                Select Food
            </option>

            {% for item in menu_items %}

            <option value="{{ item[1] }}">
                {{ item[1] }}
            </option>

            {% endfor %}

        </select>

        <input type="number"
               name="quantity"
               placeholder="Quantity"
               required>

        <button type="submit">
            Place Order
        </button>

    </form>

</div>

</body>
</html>
